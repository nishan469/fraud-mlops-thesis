# fraud_mlops on the Bank Account Fraud dataset (BAF, NeurIPS 2022; third dataset). Build the
# data first:  python prepare_baf.py
# Same policy as configs/default.toml (the one the IEEE-CIS experiments chose), unchanged.

[data]
data_dir = "data/baf"
cache_path = ""               # transactions.parquet is already the prepared table

[mlflow]
tracking_uri = "sqlite:///mlflow.db"
artifact_dir = "mlruns"
model_name = "baf-fraud"

[policy]
label_delay_days = 30
step_days = 7
retrain_every_days = 14
train_window_days = 60

[replay]
start_frac = 0.5              # months 0-3 are history, months 4-7 are the stream
out_dir = "outputs/baf/replay"
