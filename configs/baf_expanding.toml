# BAF replay with an expanding training window (all labelled history); otherwise as
# configs/baf.toml. On Sparkov this window suited the data far better than 60 days.

[data]
data_dir = "data/baf"
cache_path = ""

[mlflow]
tracking_uri = "sqlite:///mlflow.db"
artifact_dir = "mlruns"
model_name = "baf-fraud-expanding"

[policy]
label_delay_days = 30
step_days = 7
retrain_every_days = 14
train_window_days = 0         # expanding

[replay]
start_frac = 0.5
out_dir = "outputs/baf/replay_expanding"
