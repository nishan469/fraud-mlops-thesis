# fraud_mlops configuration. Relative paths resolve against the working directory
# (run commands from the project root).
#
# Defaults come from the thesis experiments (outputs/sweep, outputs/walkforward,
# outputs/seeds): a fixed schedule on a recent-data window beat drift-triggered
# retraining at every label delay, so the schedule is the primary policy and the
# performance trigger is only a safety net for sharp drops.

[data]
data_dir = "data"
cache_path = "data/cache/train_merged.parquet"   # built on first load (much faster reloads)

[mlflow]
tracking_uri = "sqlite:///mlflow.db"
artifact_dir = "mlruns"
training_experiment = "fraud-training"
monitoring_experiment = "fraud-monitoring"
model_name = "ieee-cis-fraud"

[model]
seed = 42
val_frac = 0.15              # most recent share of each training window, for early stopping,
                             # threshold choice and the promotion gate
learning_rate = 0.05
num_leaves = 256
min_child_samples = 100
subsample = 0.8
colsample_bytree = 0.5
reg_lambda = 1.0
num_boost_round = 2000
early_stopping_rounds = 100

[policy]
label_delay_days = 30        # labels (chargebacks) become usable this long after the transaction
step_days = 7                # how often the loop wakes up (monitor, decide, serve)
retrain_every_days = 14      # primary policy: scheduled retraining
train_window_days = 60       # sliding window of labelled data used for each training run (0 = expanding: all history)
safety_net_tol = 0.30        # early retrain if live PR-AUC < (1 - tol) x reference, where
                             # reference = max(champion's val PR-AUC, median of recent live PR-AUC)
history_window = 4           # recent live measurements (any champion) behind that median
min_lift = 3.0               # early retrain if live PR-AUC < min_lift x fraud rate (no-skill check;
                             # a random model's PR-AUC is about the fraud rate)
monitor_days = 14            # matured-label window used for live PR-AUC
cooldown_days = 7            # minimum days between retrain attempts
min_positives = 30           # minimum frauds in the matured window to compute live PR-AUC

[gate]
max_pr_auc_drop = 0.01       # promote unless challenger is worse than champion by more than this
min_positives = 30           # below this, the comparison is skipped and the challenger is promoted

[monitoring]
psi_features = 10            # top-importance numeric features tracked for drift (informational)
psi_alert = 0.25
psi_sample = 50000           # reference rows sampled from the champion's training window

[replay]
start_frac = 0.6             # replay starts at this row fraction (day ~101, same as experiments)
out_dir = "outputs/replay"
