# fraud_mlops on the Sparkov dataset (second dataset). Build the data first:
#   python prepare_sparkov.py
# Everything not set here uses the same defaults as configs/default.toml (the policy the
# IEEE-CIS experiments chose), so the replication tests that policy unchanged.

[data]
data_dir = "data/sparkov"
cache_path = ""               # transactions.parquet is already the prepared table

[mlflow]
tracking_uri = "sqlite:///mlflow.db"
artifact_dir = "mlruns"
model_name = "sparkov-fraud"

[policy]
label_delay_days = 30
step_days = 7
retrain_every_days = 14
train_window_days = 60

[replay]
start_frac = 0.5              # about 1 Jan 2020: one year of history before the stream
out_dir = "outputs/sparkov/replay"
