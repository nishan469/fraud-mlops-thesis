# Sparkov replay with an expanding training window (all labelled history). The seed runs showed
# the 60-day sliding window is too short for Sparkov's 0.5% fraud rate; this config tests the
# framework with the window that suited this dataset. Everything else matches configs/sparkov.toml.

[data]
data_dir = "data/sparkov"
cache_path = ""

[mlflow]
tracking_uri = "sqlite:///mlflow.db"
artifact_dir = "mlruns"
model_name = "sparkov-fraud-expanding"

[policy]
label_delay_days = 30
step_days = 7
retrain_every_days = 14
train_window_days = 0         # expanding

[replay]
start_frac = 0.5
out_dir = "outputs/sparkov/replay_expanding"
